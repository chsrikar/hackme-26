<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HACK26 Pass Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #020b18,
                    #061b35
                );

            color: white;

            font-family: Arial, sans-serif;
        }

        .container {

            text-align: center;

            padding: 40px;
        }

        .logo {

            font-size: 64px;

            font-weight: 900;

            letter-spacing: 5px;

            color: #16c8ff;
        }

        h1 {

            margin: 10px 0;

            font-size: 30px;
        }

        p {

            color: #aebed3;

            font-size: 16px;
        }

        .status {

            margin-top: 30px;

            padding: 14px 25px;

            border-radius: 10px;

            background: #0c2947;

            border: 1px solid #16c8ff;

            color: #16c8ff;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="logo">
            HACK26
        </div>

        <h1>
            Participant Pass Management System
        </h1>

        <p>
            VISAT Engineering College
        </p>

        <div class="status">
            ✓ Flask application is running
        </div>

    </div>

</body>

</html>
